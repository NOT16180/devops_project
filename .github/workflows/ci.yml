name: CI Pipeline

on:
    push:
        branches: ["main"]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            # Met le nom du repo en minuscules dans une variable d'environnement
            - name: Set lower case repo name
              run: |
                  echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            # Connexion automatique au registre GitHub
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Build de l'image
            - name: Build Docker image
              run: |
                  docker build -t ${{ env.IMAGE_NAME }}:latest .

            # Scan Trivy
            - name: Scan vulnérabilités avec Trivy
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ env.IMAGE_NAME }}:latest"
                  format: "table"
                  exit-code: "0"
                  severity: "CRITICAL,HIGH"

            # Push de l'image
            - name: Push to GHCR
              run: |
                  docker push ${{ env.IMAGE_NAME }}:latest
