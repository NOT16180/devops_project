name: CI Pipeline


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: |
          docker build -t test-api:${{ github.sha }} .

      # Nouvelle étape : scan de vulnérabilités
      - name: Scan vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # On met 0 pour observer les résultats sans bloquer le pipeline au début
          severity: 'CRITICAL,HIGH' .
